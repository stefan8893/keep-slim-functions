name: Continuous Deployment

on:
  workflow_run:
    workflows: ['Continuous Integration']
    branches: ['main']
    types: ['completed']

jobs:
  has_next_version:
    name: Get Next Version
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      HasNextVersion: ${{ steps.get_next_version.outputs.hasNextVersion }}
      Version: ${{ steps.get_next_version.outputs.version }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next version
        id: get_next_version
        uses: thenativeweb/get-next-version@2.7.1

      - name: Tag new version
        if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
        shell: pwsh
        run: |
          $nextVersion = '${{ steps.get_next_version.outputs.version }}'
          git tag $nextVersion
          git push origin $nextVersion

  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: has_next_version
    if: ${{ needs.has_next_version.outputs.HasNextVersion == 'true' }}
    environment:
      name: Production
    permissions:
      id-token: write

    env:
      Version: ${{ needs.has_next_version.outputs.Version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
        
      - name: Publish Function App
        run: dotnet publish ./src/KeepSlim/KeepSlim.csproj -c Release -o ./publish -property:version=${{ env.Version }}
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Deploy to Azure Function App
        uses: azure/functions-action@v1
        with:
          app-name:  ${{ vars.FUNCTION_APP_NAME }}
          package: ./publish
