name: Continuous Integration

on:
  push:
    branches: ['**']

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup dotnet 10.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build
        shell: pwsh
        run: dotnet build --configuration Release
